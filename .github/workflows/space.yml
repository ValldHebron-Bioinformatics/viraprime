name: Deploy web app to Hugging Face

# Pushes the web app to a free Hugging Face Gradio Space: deploy/hf-space/ (app.py,
# requirements.txt, packages.txt with MAFFT, README with the Space settings) plus viraprime/.
# One-time setup in GitHub > Settings > Secrets and variables > Actions:
#   secret   HF_TOKEN  = a Hugging Face access token with write access
#   variable HF_SPACE  = <owner>/<space>, e.g. my-lab/viraprime
# Without both, the job is skipped.

on:
  push:
    branches: [master]
    paths: ["viraprime/**", "deploy/hf-space/**", ".github/workflows/space.yml"]
  workflow_dispatch:

concurrency:
  group: space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "HF_TOKEN secret or HF_SPACE variable not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - name: Assemble the Space
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir space
          cp deploy/hf-space/* space/
          tar --exclude=__pycache__ -cf - viraprime | tar -xf - -C space

      - name: Upload to Hugging Face
        if: steps.cfg.outputs.ready == 'true'
        run: |
          pip install --quiet "huggingface_hub>=0.24"
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"], repo_type="space", folder_path="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns=["viraprime/**"],
          )
          EOF
